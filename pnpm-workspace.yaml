packages:
  - "."

# Keep these aligned with package.json pnpm.overrides: Docker uses pnpm 9,
# while pnpm 11 reads overrides from this workspace file.
overrides:
  "brace-expansion@>=1.0.0 <1.1.18": "1.1.18"
  "fast-uri@>=3.0.0 <3.1.6": "3.1.6"
  "hono@>=4.0.0 <4.13.5": "4.13.5"
  "mysql2@>=3.0.0 <3.23.1": "3.23.1"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "qs@>=6.0.0 <6.16.0": "6.16.0"

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
